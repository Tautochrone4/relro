---
layout: default
still_background: true
---
<main class="wrap page">
  <p class="page__meta">{{ page.date | date: "%d %B %Y" }}{% if page.topic %} · {{ page.topic }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.intro %}<p class="page__intro">{{ page.intro }}</p>{% endif %}
  <article class="prose">
    {{ content }}
  </article>
</main>
